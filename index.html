<!DOCTYPE html>
<html>
<head>
    <title>Sketch Neko Model</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="app">
        <div id="toolbar">
            <button class="tool-btn" data-tool="add-cube">Cube</button>
            <button class="tool-btn" data-tool="add-sphere">Sphere</button>
            <button class="tool-btn" data-tool="add-cylinder">Cylinder</button>
            <button class="tool-btn" data-tool="delete">Delete</button>
            <button class="tool-btn" data-tool="export">Export</button>
        </div>

        <div id="main">
            <div id="hierarchy-panel" class="panel">
                <h3>Objects</h3>
                <div id="object-list"></div>
            </div>

            <div id="viewport-container">
                <canvas id="viewport"></canvas>
            </div>

            <div id="properties-panel" class="panel">
                <h3>Properties</h3>
                <div id="properties"></div>
            </div>
        </div>

        <div id="timeline" class="panel">
            <h3>Timeline</h3>
            <div id="timeline-controls">
                <button id="play-btn">▶ Play</button>
                <button id="add-keyframe">+ Keyframe</button>
                <input type="range" id="time-slider" min="0" max="100" value="0">
                <span id="time-display">0.0s</span>
            </div>
        </div>
    </div>

    <script src="core.js"></script>
    <script src="editor.js"></script>
    <script src="ui.js"></script>
</body>
</html>
