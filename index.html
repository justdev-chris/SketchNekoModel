<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sketch Neko Model</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Three.js + Official Controls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/OBJExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>
</head>
<body>
    <div id="app">
        <!-- Top Toolbar -->
        <div id="toolbar">
            <div class="tool-group">
                <button class="tool-btn" data-tool="add-cube">Cube</button>
                <button class="tool-btn" data-tool="add-sphere">Sphere</button>
                <button class="tool-btn" data-tool="add-cylinder">Cylinder</button>
                <button class="tool-btn" data-tool="add-cone">Cone</button>
                <button class="tool-btn" data-tool="add-torus">Torus</button>
            </div>

            <div class="tool-group">
                <button class="tool-btn mode-btn active" data-mode="translate">Move</button>
                <button class="tool-btn mode-btn" data-mode="rotate">Rotate</button>
                <button class="tool-btn mode-btn" data-mode="scale">Scale</button>
            </div>

            <div class="tool-group">
                <button class="tool-btn" data-tool="extrude">Extrude</button>
                <button class="tool-btn" data-tool="bevel">Bevel</button>
                <button class="tool-btn" data-tool="subdivide">Subdivide</button>
            </div>

            <div class="tool-group">
                <button class="tool-btn" data-tool="duplicate">Duplicate</button>
                <button class="tool-btn" data-tool="delete">Delete</button>
            </div>

            <div class="tool-group">
                <div class="dropdown">
                    <button class="tool-btn">Export ▼</button>
                    <div class="dropdown-content">
                        <a href="#" data-export="glb">GLB (.glb)</a>
                        <a href="#" data-export="gltf">GLTF (.gltf)</a>
                        <a href="#" data-export="obj">OBJ (.obj)</a>
                        <a href="#" data-export="stl">STL (.stl)</a>
                    </div>
                </div>
            </div>

            <div class="tool-group">
                <button class="tool-btn" id="play-btn">▶ Play</button>
                <button class="tool-btn" data-tool="add-keyframe">+ Keyframe</button>
            </div>
        </div>

        <!-- Main Content -->
        <div id="main">
            <!-- Left Panel: Hierarchy -->
            <div id="hierarchy-panel" class="panel">
                <h3>🎯 Scene Hierarchy</h3>
                <div id="object-list"></div>
            </div>

            <!-- Center: 3D Viewport -->
            <div id="viewport-container">
                <canvas id="viewport"></canvas>
                <div id="coordinates">X: 0.00 Y: 0.00 Z: 0.00</div>
            </div>

            <!-- Right Panel: Properties -->
            <div id="properties-panel" class="panel">
                <h3>🔧 Properties</h3>
                <div id="property-fields"></div>
                
                <div class="property-group">
                    <h4>🎨 Material</h4>
                    <div class="property-row">
                        <label>Color:</label>
                        <input type="color" id="color-picker">
                    </div>
                    <div class="property-row">
                        <label>Metalness:</label>
                        <input type="range" id="metal-slider" min="0" max="1" step="0.1">
                    </div>
                    <div class="property-row">
                        <label>Roughness:</label>
                        <input type="range" id="rough-slider" min="0" max="1" step="0.1">
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom: Timeline -->
        <div id="timeline" class="panel">
            <div id="timeline-controls">
                <button id="goto-start">⏮</button>
                <button id="prev-frame">⏪</button>
                <button id="play-pause">▶</button>
                <button id="next-frame">⏩</button>
                <button id="goto-end">⏭</button>
                <input type="range" id="time-slider" min="0" max="100" value="0">
                <span id="time-display">0.00s</span>
                <input type="number" id="fps" value="24" min="1" max="60" style="width: 50px;"> FPS
            </div>
            <div id="keyframe-track"></div>
        </div>

        <!-- Status Bar -->
        <div id="statusbar">
            <span id="status">Ready | Objects: 0</span>
            <span id="fps-counter">FPS: 60</span>
        </div>
    </div>

    <!-- Our JS Files -->
    <script src="core.js"></script>
    <script src="editor.js"></script>
    <script src="ui.js"></script>
</body>
</html>
