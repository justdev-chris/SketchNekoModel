<!DOCTYPE html>
<html>
<head>
    <title>Blender Lite</title>
    <meta charset="utf-8">
    <style>
        body { 
            margin: 0; 
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        #toolbar {
            background: #2d2d2d;
            color: white;
            padding: 10px;
            display: flex;
            gap: 10px;
        }
        
        button {
            background: #444;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        
        button:hover {
            background: #555;
        }
        
        #main {
            display: flex;
            flex: 1;
        }
        
        #sidebar {
            width: 250px;
            background: #f5f5f5;
            padding: 15px;
            overflow-y: auto;
        }
        
        #viewport {
            flex: 1;
            background: #1a1a1a;
        }
        
        .object-item {
            padding: 5px;
            margin: 2px 0;
            background: white;
            cursor: pointer;
            border-radius: 3px;
        }
        
        .object-item:hover {
            background: #e0e0e0;
        }
        
        canvas { 
            display: block; 
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="toolbar">
            <button onclick="addCube()">Add Cube</button>
            <button onclick="addSphere()">Add Sphere</button>
            <button onclick="exportGLB()">Export GLB</button>
            <button onclick="clearScene()">Clear</button>
        </div>
        
        <div id="main">
            <div id="sidebar">
                <h3>Hierarchy</h3>
                <div id="hierarchy"></div>
                <div id="properties" style="margin-top: 20px;">
                    <h3>Properties</h3>
                    <div id="property-fields"></div>
                </div>
            </div>
            <div id="viewport"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // ========== GLOBAL VARIABLES ==========
        let scene, camera, renderer, controls;
        let objects = [];
        let selectedObject = null;
        
        // ========== INITIALIZATION ==========
        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);
            
            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 5, 5);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(document.getElementById('viewport').offsetWidth, 
                            document.getElementById('viewport').offsetHeight);
            document.getElementById('viewport').appendChild(renderer.domElement);
            
            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            
            // Lighting
            const light1 = new THREE.DirectionalLight(0xffffff, 1);
            light1.position.set(5, 5, 5);
            scene.add(light1);
            
            const light2 = new THREE.AmbientLight(0x404040);
            scene.add(light2);
            
            // Grid helper
            const grid = new THREE.GridHelper(20, 20, 0x888888, 0x444444);
            scene.add(grid);
            
            // Start animation
            animate();
            
            // Handle resize
            window.addEventListener('resize', onWindowResize);
        }
        
        // ========== CORE FUNCTIONS ==========
        function addCube() {
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshStandardMaterial({ 
                color: Math.random() * 0xffffff,
                metalness: 0.1,
                roughness: 0.5
            });
            const cube = new THREE.Mesh(geometry, material);
            cube.position.set(
                (Math.random() - 0.5) * 5,
                0.5,
                (Math.random() - 0.5) * 5
            );
            cube.name = `Cube_${objects.length + 1}`;
            cube.userData = { type: 'cube' };
            
            scene.add(cube);
            objects.push(cube);
            updateHierarchy();
            selectObject(cube);
        }
        
        function addSphere() {
            const geometry = new THREE.SphereGeometry(0.5, 32, 32);
            const material = new THREE.MeshStandardMaterial({ 
                color: Math.random() * 0xffffff,
                metalness: 0.3,
                roughness: 0.2
            });
            const sphere = new THREE.Mesh(geometry, material);
            sphere.position.set(
                (Math.random() - 0.5) * 5,
                0.5,
                (Math.random() - 0.5) * 5
            );
            sphere.name = `Sphere_${objects.length + 1}`;
            sphere.userData = { type: 'sphere' };
            
            scene.add(sphere);
            objects.push(sphere);
            updateHierarchy();
            selectObject(sphere);
        }
        
        function selectObject(obj) {
            // Remove previous highlight
            if (selectedObject) {
                scene.remove(selectedObject.userData.highlightBox);
            }
            
            selectedObject = obj;
            
            // Add highlight box
            const box = new THREE.BoxHelper(obj, 0x00ff00);
            box.name = 'highlight';
            scene.add(box);
            obj.userData.highlightBox = box;
            
            // Update UI
            updateProperties();
        }
        
        function updateHierarchy() {
            const hierarchyDiv = document.getElementById('hierarchy');
            hierarchyDiv.innerHTML = '';
            
            objects.forEach((obj, index) => {
                const div = document.createElement('div');
                div.className = 'object-item';
                div.textContent = obj.name;
                div.onclick = () => selectObject(obj);
                hierarchyDiv.appendChild(div);
            });
        }
        
        function updateProperties() {
            const propsDiv = document.getElementById('property-fields');
            propsDiv.innerHTML = '';
            
            if (!selectedObject) return;
            
            // Position controls
            ['X', 'Y', 'Z'].forEach((axis, i) => {
                const label = document.createElement('label');
                label.textContent = `Position ${axis}: `;
                propsDiv.appendChild(label);
                
                const input = document.createElement('input');
                input.type = 'number';
                input.step = '0.1';
                input.value = selectedObject.position.getComponent(i).toFixed(2);
                input.oninput = (e) => {
                    selectedObject.position.setComponent(i, parseFloat(e.target.value));
                    selectedObject.userData.highlightBox.update();
                };
                propsDiv.appendChild(input);
                propsDiv.appendChild(document.createElement('br'));
            });
            
            // Color picker
            const colorLabel = document.createElement('label');
            colorLabel.textContent = 'Color: ';
            propsDiv.appendChild(colorLabel);
            
            const colorInput = document.createElement('input');
            colorInput.type = 'color';
            colorInput.value = '#' + selectedObject.material.color.getHexString();
            colorInput.oninput = (e) => {
                selectedObject.material.color.set(e.target.value);
            };
            propsDiv.appendChild(colorInput);
        }
        
        function exportGLB() {
            const exporter = new THREE.GLTFExporter();
            exporter.parse(scene, (gltf) => {
                const output = JSON.stringify(gltf, null, 2);
                const blob = new Blob([output], { type: 'text/plain' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'scene.glb';
                link.click();
            });
        }
        
        function clearScene() {
            objects.forEach(obj => {
                scene.remove(obj);
                if (obj.userData.highlightBox) {
                    scene.remove(obj.userData.highlightBox);
                }
            });
            objects = [];
            selectedObject = null;
            updateHierarchy();
            document.getElementById('property-fields').innerHTML = '';
        }
        
        // ========== UTILITIES ==========
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            camera.aspect = document.getElementById('viewport').offsetWidth / 
                           document.getElementById('viewport').offsetHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(document.getElementById('viewport').offsetWidth, 
                           document.getElementById('viewport').offsetHeight);
        }
        
        // ========== START EVERYTHING ==========
        window.onload = init;
    </script>
</body>
</html>
